<div class="dashboard-container">

  <div class="sidebar shadow-sm d-flex flex-column justify-content-between">

    <div>
      <h5 class="fw-bold text-sky mb-3">Company Dashboard</h5>

      <ul class="list-group">

        <a routerLink="/dashboard/profile" routerLinkActive="active-link" class="list-item">
          <i class="bi bi-building me-2"></i> Company Profile
        </a>

        <a routerLink="/dashboard/add-internship" routerLinkActive="active-link" class="list-item">
          <i class="bi bi-plus-square me-2"></i> Add Internships
        </a>

        <a routerLink="/dashboard/manage-internship" routerLinkActive="active-link" class="list-item">
          <i class="bi bi-briefcase me-2"></i> Manage Internships
        </a>

        <a routerLink="/dashboard/applications" routerLinkActive="active-link" class="list-item">
          <i class="bi bi-people me-2"></i> Applications
        </a>

      </ul>
    </div>

    <!-- 👇 Profile Section -->
    <div class="profile-section">
      <div class="profile-box">
        <div class="profile-info">
          <div class="avatar">
            {{ companyName?.charAt(0) || 'A' }}
          </div>
          <div>
            <div class="name">{{ companyName }}</div>
            <div class="role">Company</div>
          </div>
        </div>

        <!-- Hover Menu -->
        <div class="profile-dropdown">
          <button (click)="logout()" class="logout-btn">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Main Content Area -->
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

</div>
