<div class="form-wrap">

<button type="button" class="btn btn-link p-0 mb-3" (click)="router.navigate(['/dashboard/manage-internship'])">← Back</button>

<h2 class="form-title">
  {{ isEditMode ? 'Edit Internship' : 'Post Internship' }}
</h2>

<p class="form-subtitle">Fields marked * are mandatory</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()" class="internship-form">

<!-- ================= COMPANY ================= -->
<div class="card">

<h3>🏢 Company Information</h3>

<div class="grid">

<input placeholder="Company Name *" formControlName="companyName">

<input placeholder="Company Website" formControlName="companyWebsite">

<input placeholder="Location *" formControlName="companyLocation">

<input placeholder="Industry / Domain *" formControlName="industryDomain">

<textarea placeholder="About Company *" formControlName="aboutCompany"></textarea>

</div>
</div>


<!-- ================= INTERNSHIP ================= -->
<div class="card">

<h3>💼 Internship Details</h3>

<div class="grid">

<input placeholder="Internship Title *" formControlName="internshipTitle">

<input placeholder="Department *" formControlName="department">

<select formControlName="internshipType">
  <option value="">Internship Type *</option>
  <option value="REMOTE">Remote</option>
  <option value="ONSITE">Onsite</option>
  <option value="HYBRID">Hybrid</option>
</select>

<input type="number" placeholder="Duration (Months) *" formControlName="duration">

<input type="date" formControlName="startDate">

<select formControlName="workingHours">
  <option value="">Working Hours *</option>
  <option value="FULL_TIME">Full Time</option>
  <option value="PART_TIME">Part Time</option>
</select>

</div>
</div>


<!-- ================= ROLE ================= -->
<div class="card">

<h3>📋 Role & Responsibilities</h3>

<div class="grid">

<textarea placeholder="Job Description *" formControlName="jobDescription"></textarea>

<textarea placeholder="Daily Tasks *" formControlName="dailyTasks"></textarea>

<input placeholder="Tools / Technologies" formControlName="toolsUsed">

<input placeholder="Projects" formControlName="projects">

</div>
</div>


<!-- ================= ELIGIBILITY ================= -->
<div class="card">

<h3>🎯 Eligibility</h3>

<div class="grid">

<input placeholder="Required Skills *" formControlName="skills">

<input placeholder="Qualification *" formControlName="qualification">

<input placeholder="Year of Study" formControlName="year">

<input placeholder="Experience" formControlName="experience">

<input placeholder="Language" formControlName="language">

</div>
</div>


<!-- ================= BENEFITS ================= -->
<div class="card">

<h3>💰 Stipend & Benefits</h3>

<div class="grid">

<input type="number" placeholder="Stipend *" formControlName="stipend">

<select formControlName="paymentMode">
  <option value="">Payment Mode</option>
  <option value="MONTHLY">Monthly</option>
  <option value="LUMPSUM">Lump Sum</option>
</select>

<div class="checkbox-row">
  <label><input type="checkbox" formControlName="certificate"> Certificate</label>
  <label><input type="checkbox" formControlName="lor"> LOR</label>
  <label><input type="checkbox" formControlName="ppo"> PPO</label>
</div>

<textarea placeholder="Other Benefits" formControlName="benefits"></textarea>

</div>
</div>


<!-- ================= APPLICATION ================= -->
<div class="card">

<h3>📝 Application Info</h3>

<div class="grid">

<input type="number" placeholder="Openings *" formControlName="openings">

<input type="date" formControlName="lastDate">

<input placeholder="Apply Link *" formControlName="applyLink">

<input placeholder="Selection Process" formControlName="process">

<input placeholder="HR Email *" formControlName="hrEmail">

</div>
</div>


<!-- ================= EXTRA ================= -->
<div class="card">

<h3>⭐ Extra</h3>

<div class="grid">

<select formControlName="level">
  <option value="">Internship Level</option>
  <option value="BEGINNER">Beginner</option>
  <option value="INTERMEDIATE">Intermediate</option>
  <option value="ADVANCED">Advanced</option>
</select>

<input placeholder="Tags (AI, Web, Startup)" formControlName="tags">

<select formControlName="status">
  <option value="ACTIVE">Active</option>
  <option value="CLOSED">Closed</option>
</select>

</div>
</div>


<!-- ================= SUBMIT ================= -->
<div class="submit-box">
<p>Form Valid: {{ form.valid }}</p>
<button type="submit" [disabled]="form.invalid">
  {{ isEditMode ? 'Update Internship' : 'Post Internship' }}
</button>

</div>

</form>
</div>
