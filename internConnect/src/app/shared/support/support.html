<!-- HERO SECTION -->
<section class="contact-hero d-flex align-items-center justify-content-center text-center text-white">
  <div class="container animate__animated animate__fadeInDown">
    <h1 class="fw-bold">Get in <span class="text-sky">Touch</span></h1>
    <p class="lead mt-3">We’re here to help you with internships, partnerships, or any queries!</p>
  </div>
</section>

<!-- CONTACT INFO SECTION -->
<section class="contact-info py-5">
  <div class="container">
    <div class="row text-center g-4">

      <!-- Location -->
      <div class="col-md-4 animate__animated animate__fadeInLeft">
        <div class="card border-0 shadow-sm p-4 h-100 rounded-4">
          <i class="bi bi-geo-alt-fill fs-1 text-sky"></i>
          <h5 class="mt-3 fw-semibold">Our Office</h5>
          <p class="text-muted">Wagholi, Maharashtra, India</p>
        </div>
      </div>

      <!-- Email -->
      <div class="col-md-4 animate__animated animate__fadeInUp">
        <div class="card border-0 shadow-sm p-4 h-100 rounded-4">
          <i class="bi bi-envelope-fill fs-1 text-sky"></i>
          <h5 class="mt-3 fw-semibold">Email Us</h5>
          <p class="text-muted">support@internconnect.in</p>
        </div>
      </div>

      <!-- Phone -->
      <div class="col-md-4 animate__animated animate__fadeInRight">
        <div class="card border-0 shadow-sm p-4 h-100 rounded-4">
          <i class="bi bi-telephone-fill fs-1 text-sky"></i>
          <h5 class="mt-3 fw-semibold">Call Us</h5>
          <p class="text-muted">+91 98765 43210</p>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- CONTACT FORM -->
<section class="contact-form py-5 bg-light">
  <div class="container">
    <div class="row align-items-center">

      <!-- Image -->
      <div class="col-md-6 animate__animated animate__fadeInLeft">
        <img 
          src="https://cdn-icons-png.flaticon.com/512/2921/2921226.png" 
          alt="Contact Us" 
          class="img-fluid rounded shadow"
        >
      </div>

      <!-- Form -->
      <div class="col-md-6 animate__animated animate__fadeInRight">
        <h2 class="fw-bold mb-4 text-sky">Send Us a Message</h2>

        <form>
          <div class="mb-3">
            <label class="form-label fw-semibold">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Your Email</label>
            <input type="email" class="form-control" placeholder="Enter your email" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Message</label>
            <textarea class="form-control" rows="4" placeholder="Write your message..." required></textarea>
          </div>

          <button class="btn btn-sky w-100 py-2 fw-bold">Send Message</button>
        </form>
      </div>

    </div>
  </div>
</section>
