<div class="project-resume-page">
  <div class="page-header mb-4">
    <h2>Projects & Resume</h2>
    <p class="text-muted">Showcase your work experience and download your resume</p>
  </div>

  <div class="card shadow-sm border-0" *ngIf="!loading">
    <!-- PROJECT SECTION -->
    <div class="card-body p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="section-title">Projects</h3>
        <button class="btn btn-outline-primary btn-sm" (click)="editProjects()">Edit</button>
      </div>

      <div class="project-list" *ngIf="projects.length > 0; else noProjects">
        <div class="project" *ngFor="let p of projects">
          <div class="project-header">
            <h4>{{ p.title }}</h4>
            <span class="tech-tag">{{ p.tech }}</span>
          </div>
          <p>{{ p.description }}</p>
        </div>
      </div>
      <ng-template #noProjects>
        <p class="text-muted">No projects added yet.</p>
      </ng-template>

      <hr>

      <!-- RESUME SECTION -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="section-title">Resume</h3>
        <button class="btn btn-outline-primary btn-sm" (click)="editResume()">Edit</button>
      </div>

      <div class="resume-actions" *ngIf="resumeUrl; else noResume">
        <a [href]="resumeUrl" target="_blank" class="btn btn-primary">
          <i class="bi bi-download me-2"></i>View Resume
        </a>
      </div>
      <ng-template #noResume>
        <p class="text-muted">No resume uploaded yet.</p>
      </ng-template>
    </div>
  </div>

  <div *ngIf="loading" class="text-center mt-5">
    <p>Loading...</p>
  </div>
</div>
