<div class="ai-chatbot container">
  <div class="d-flex align-items-center mb-4">
    <button type="button" class="btn btn-link p-0 me-3" routerLink="/student-dashboard">
      <i class="bi bi-arrow-left"></i> Back to Dashboard
    </button>
    <h2 class="mb-0">AI Career Assistant</h2>
  </div>

  <div class="chat-container card">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">
        <i class="bi bi-robot"></i> AI Chatbot
      </h5>
    </div>

    <div class="card-body chat-messages" #chatMessages>
      <div class="message" *ngFor="let msg of messages" [ngClass]="{'user-message': msg.isUser, 'bot-message': !msg.isUser}">
        <div class="message-content">
          <p>{{ msg.text }}</p>
          <small class="text-muted">{{ msg.timestamp | date:'shortTime' }}</small>
        </div>
      </div>

      <div class="typing-indicator" *ngIf="isTyping">
        <div class="typing-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <small class="text-muted">AI is typing...</small>
      </div>
    </div>

    <div class="card-footer">
      <div class="input-group">
        <input
          type="text"
          class="form-control"
          placeholder="Ask me anything about careers, internships, or resume tips..."
          [(ngModel)]="newMessage"
          (keypress)="onKeyPress($event)"
          [disabled]="isTyping">
        <button
          class="btn btn-primary"
          type="button"
          (click)="sendMessage()"
          [disabled]="!newMessage.trim() || isTyping">
          <i class="bi bi-send"></i> Send
        </button>
      </div>
    </div>
  </div>

  <div class="mt-3 text-center">
    <small class="text-muted">
      This AI assistant provides general career guidance. For personalized advice, consult with career counselors.
    </small>
  </div>
</div>
