<div class="container mt-5">
  <h2>Add/Edit Projects</h2>
  <button type="button" class="btn btn-link p-0 mb-3" (click)="router.navigate(['/student-dashboard'])">← Back</button>
  <form [formGroup]="projectsForm" (ngSubmit)="saveProjects()">
    <div class="mb-3">
      <label>Project Title</label>
      <input type="text" class="form-control" formControlName="title" required>
    </div>
    <div class="mb-3">
      <label>Description</label>
      <textarea rows="4" class="form-control" formControlName="description" required></textarea>
    </div>
    <div class="mb-3">
      <label>Technologies Used</label>
      <input type="text" class="form-control" formControlName="tech" placeholder="e.g., Angular, Spring Boot">
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="!projectsForm.valid">Save & Next</button>
    <button type="button" class="btn btn-secondary ms-2" (click)="router.navigate(['/student-dashboard'])">Skip</button>
  </form>
</div>
